version: 2
image_name: starter
storage:
  backends:
    kv_default:
      type: kv_sqlite
      db_path: ${env.SQLITE_STORE_DIR:=/tmp/.llama/distributions/starter}/kvstore.db
    sql_default:
      type: sql_postgres
      host: ${env.POSTGRES_HOST:=localhost}
      port: ${env.POSTGRES_PORT:=5432}
      db: ${env.POSTGRES_DB:=assisted-chat}
      user: ${env.POSTGRES_USER:=assisted-chat}
      password: ${env.POSTGRES_PASSWORD:=assisted-chat}
  stores:
    metadata:
      backend: kv_default
      namespace: registry
    inference:
      backend: sql_default
      table_name: inference_store
    conversations:
      backend: sql_default
      table_name: openai_conversations
    prompts:
      backend: sql_default
      table_name: prompts
    connectors:
      backend: sql_default
      table_name: connectors
apis:
- responses
- batches
- files
- inference
- tool_runtime
- conversations
- vector_io
providers:
  inference:
  - config:
      project: ${env.VERTEX_AI_PROJECT}
    provider_id: gemini
    provider_type: remote::vertexai
  - config: {}
    provider_id: sentence-transformers
    provider_type: inline::sentence-transformers
  vector_io:
  - config:
      persistence:
        backend: kv_default
        namespace: ocp-assisted-installer-4-19
    provider_id: ocp-assisted-installer-4-19
    provider_type: inline::faiss
  files:
  - config:
      storage_dir: /tmp/llama-stack-files
      metadata_store:
        backend: sql_default
        table_name: files_metadata
    provider_id: localfs
    provider_type: inline::localfs
  responses:
  - provider_id: builtin
    provider_type: inline::builtin
    config:
      persistence:
        responses:
          backend: sql_default
          table_name: agents_responses
  batches:
  - provider_id: reference
    provider_type: inline::reference
    config:
      sqlstore:
        backend: sql_default
        table_name: batches
  tool_runtime:
  - provider_id: model-context-protocol
    provider_type: remote::model-context-protocol
    config: {}
models:
- metadata:
    embedding_dimension: 768
  model_id: sentence-transformers/all-mpnet-base-v2
  provider_id: sentence-transformers
  provider_model_id: /app-root/all-mpnet-base-v2
  model_type: embedding
shields: []
vector_dbs:
  - vector_db_id: ocp-assisted-installer-4-19
    embedding_model: sentence-transformers/all-mpnet-base-v2
    embedding_dimension: 768
    provider_id: ocp-assisted-installer-4-19
    provider_vector_db_id: ocp-assisted-installer-4-19
tool_groups:
- toolgroup_id: mcp::assisted
  provider_id: model-context-protocol
  mcp_endpoint:
    uri: "http://assisted-service-mcp:8000/mcp"
server:
  port: 8321
